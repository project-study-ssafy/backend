<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    .navbar {
      background-color: #007bff;
      padding: 10px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }
    /* 메뉴 바 스타일 */
    .menu {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0056b3;
      padding: 15px 0;
    }

    .menu a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.3s;
    }

    .menu a:hover {
      color: #ffcc00;
    }

    .container {
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .dashboard {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      flex: 1 1 45%;
    }
    .dashboard h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 20px;
    }
    .dashboard a {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
    .dashboard a:hover {
      background-color: #0056b3;
    }
    .stat-card {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 15px;
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    .stat-card div {
      text-align: center;
    }
    .stat-card h3 {
      margin: 0;
      font-size: 20px;
      color: #333;
    }
    .stat-card p {
      margin: 0;
      color: #007bff;
      font-size: 16px;
    }
    .board-list {
      list-style-type: none;
      padding: 0;
    }
    .board-list li {
      margin: 10px 0;
    }
    .section-header {
      font-size: 20px;
      color: #333;
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="navbar">
  <span>관리자 대시보드</span>
  <a href="/admin/logout">로그아웃</a>
</div>

<!-- 메뉴 바 추가 -->
<div class="menu">
  <a href="/admin/home">대시보드</a>
  <a href="/admin/users">사용자 관리</a>
  <a href="/admin/boards">게시판 관리</a>
</div>

<div class="container">
  <!-- 통계 카드 영역 -->
  <div class="dashboard">
    <h2>대시보드</h2>
    <div class="stat-card">
      <div>
        <h3>등록된 사용자 수</h3>
        <p th:text="${userCount}">0</p>
      </div>
      <div>
        <h3>등록된 게시글 수</h3>
        <p th:text="${postCount}">0</p>
      </div>
    </div>
  </div>

  <!-- 게시판 목록 영역 -->
  <div class="dashboard">
    <h2 class="section-header">게시판 목록</h2>
    <ul class="board-list">
      <li th:each="board : ${boards}">
        <a th:href="@{'/admin/boards/' + ${board.id}}" th:text="${board.boardName}">게시판 이름</a>
      </li>
    </ul>
  </div>

  <!-- 관리 링크 영역 -->
  <div class="dashboard">
    <h2 class="section-header">관리</h2>
    <a href="/admin/users">사용자 관리</a>
    <a href="/admin/boards">게시판 관리</a>
  </div>
</div>

</body>
</html>
