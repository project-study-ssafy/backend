<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용자 목록</title>
  <style>
    /* 기본 스타일 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }

    h1 {
      color: #333;
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
    }

    /* 메뉴 스타일 */
    .menu {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0056b3;
      padding: 15px 0;
    }

    .menu a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.3s;
    }

    .menu a:hover {
      color: #ffcc00;
    }

    /* 테이블 스타일 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      background-color: #fff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    /* 페이지네이션 스타일 */
    .pagination {
      display: flex;
      justify-content: center;
      list-style-type: none;
      padding: 0;
      margin: 20px 0;
    }

    .pagination li {
      margin: 0 5px;
    }

    .pagination a {
      text-decoration: none;
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .pagination a:hover {
      background-color: #0056b3;
    }

    .pagination a.active {
      background-color: #28a745;
    }

    .navbar {
      background-color: #007bff;
      padding: 10px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }
  </style>
</head>
<body>

<!-- 네비게이션 바 -->
<div class="navbar">
  <span>관리자 대시보드</span>
  <a href="/admin/login">로그아웃</a>
</div>

<!-- 메뉴 -->
<div class="menu">
  <a href="/admin/home">대시보드</a>
  <a href="/admin/users">사용자 관리</a>
  <a href="/admin/boards">게시판 관리</a>
</div>

<!-- 사용자 목록 출력 -->
<div class="container">
  <div class="dashboard">
    <h2>사용자 목록</h2>
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>이름</th>
        <th>이메일</th>
        <th>역할</th>
        <th>가입일</th> <!-- createdAt 컬럼 추가 -->
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${userPage.content}" th:onclick="|window.location.href='/admin/users/' + ${user.id}|">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.role}"></td>
        <td th:text="${user.createdAt}"></td>
      </tr>
      </tbody>
    </table>

    <!-- 페이지네이션 -->
    <div class="pagination">
      <li th:each="pageNum : ${#numbers.sequence(0, userPage.totalPages - 1)}">
        <a th:href="@{/admin/users(page=${pageNum})}" th:text="${pageNum + 1}"
           th:classappend="${pageNum == userPage.number ? 'active' : ''}">1</a>
      </li>
    </div>
  </div>
</div>

</body>
</html>
